<!-- UDAAN Saathi Chatbot -->
<div id="ai-chatbot-container">

    <!-- Floating Button -->
    <button id="chatbot-toggle-btn"
            type="button"
            aria-label="Open UDAAN Saathi"
            title="Chat with UDAAN Saathi">

        <span class="chatbot-fab-ring"></span>

        <span class="chatbot-fab-icon">
            <i class="fas fa-hands-helping"></i>
        </span>
    </button>


    <!-- Chat Window -->
    <div id="chatbot-window"
         class="hidden"
         role="dialog"
         aria-label="UDAAN Saathi AI Assistant">

        <!-- Header -->
        <div class="chatbot-header">

            <div class="chatbot-header-left">

                <div class="chatbot-logo">
                    <i class="fas fa-hands-helping"></i>

                    <span class="chatbot-online-dot"></span>
                </div>

                <div class="chatbot-header-info">
                    <h3>UDAAN Saathi</h3>

                    <p>
                        <span class="status-dot"></span>
                        Online & ready to help
                    </p>
                </div>

            </div>


            <div class="chatbot-header-actions">

                <button id="chatbot-clear-btn"
                        type="button"
                        title="Clear conversation"
                        aria-label="Clear conversation">
                    <i class="fas fa-trash-alt"></i>
                </button>

                <button id="chatbot-close-btn"
                        type="button"
                        title="Close chatbot"
                        aria-label="Close chatbot">
                    <i class="fas fa-times"></i>
                </button>

            </div>

        </div>


        <!-- Welcome / Messages -->
        <div id="chatbot-messages">

            <!-- Welcome Message -->
            <div class="chatbot-welcome">

                <div class="welcome-icon">
                    <i class="fas fa-hands-helping"></i>
                </div>

                <div class="welcome-content">

                    <div class="welcome-title">
                        Namaste! 👋
                    </div>

                    <div class="welcome-subtitle">
                        I'm <strong>UDAAN Saathi</strong>
                    </div>

                    <p>
                        Your AI assistant for UDAAN Society.
                        I can help you learn about our work,
                        volunteering, blood donation, careers,
                        projects and community initiatives.
                    </p>

                </div>

            </div>


            <!-- Quick Questions -->
            <div class="quick-questions">

                <div class="quick-title">
                    <i class="fas fa-sparkles"></i>
                    You can ask me
                </div>

                <div class="quick-buttons">

                    <button type="button"
                            class="quick-question"
                            data-question="What is UDAAN Society?">
                        <i class="fas fa-building"></i>
                        What is UDAAN Society?
                    </button>

                    <button type="button"
                            class="quick-question"
                            data-question="How can I volunteer with UDAAN Society?">
                        <i class="fas fa-hands-helping"></i>
                        How can I volunteer?
                    </button>

                    <button type="button"
                            class="quick-question"
                            data-question="What is the Har Ghar Jal Project?">
                        <i class="fas fa-droplet"></i>
                        Har Ghar Jal Project
                    </button>

                    <button type="button"
                            class="quick-question"
                            data-question="How do I request blood?">
                        <i class="fas fa-heart-pulse"></i>
                        Blood donation
                    </button>

                </div>

            </div>

        </div>


        <!-- Typing Indicator -->
        <div id="chatbot-typing-indicator"
            class="chatbot-typing-indicator"
            style="display: none;">

            <div class="chatbot-message-avatar chatbot-ai-avatar">
                <i class="fas fa-robot"></i>
            </div>

            <div class="chatbot-typing-bubble">
                <span class="typing-text">UDAAN Saathi is typing</span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            </div>
        </div>


        <!-- Input -->
        <div class="chatbot-input-area">

            <form id="chatbot-form">

                <div class="chatbot-input-wrapper">

                    <textarea
                        id="chatbot-input"
                        rows="1"
                        placeholder="Ask UDAAN Saathi..."
                        autocomplete="off"
                        required></textarea>

                    <button
                        type="submit"
                        aria-label="Send message"
                        title="Send message">

                        <i class="fas fa-paper-plane"></i>

                    </button>

                </div>

            </form>


            <div class="chatbot-footer">

                <span>
                    <i class="fas fa-shield-halved"></i>
                    UDAAN Society
                </span>

                <span class="footer-separator">•</span>

                <span>
                    Powered by AI
                </span>

            </div>

        </div>

    </div>

</div>
